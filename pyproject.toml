[project]
name = "capture-studio"
version = "0.1.0"
description = "Local photo-to-3D Gaussian Splatting pipeline with capture quality analysis"
authors = [
    { name = "kuchris", email = "kuchrisuk@gmail.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "gsplat @ git+https://github.com/nerfstudio-project/gsplat.git@2b902ff1891fc7f73f0f9b8c8bfc932cef2b198c",
    "numpy>=2.0,<3",
    "torch==2.10.0",
]

[project.scripts]
capture-studio = "capture_studio:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ninja>=1.13.0",
    "pytest>=9.1.1",
    "setuptools<82",
    "wheel>=0.46.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.uv.extra-build-dependencies]
gsplat = ["ninja>=1.13.0", "setuptools<82", "torch==2.10.0", "wheel>=0.46.3"]

[tool.uv.extra-build-variables]
gsplat = { BUILD_3DGS = "1", BUILD_EXPERIMENTAL = "0", TORCH_CUDA_ARCH_LIST = "12.0", MAX_JOBS = "2" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
