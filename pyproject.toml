[project]
name = "capture-studio"
version = "0.1.0"
description = "Local photo-to-3D Gaussian Splatting pipeline with capture quality analysis"
authors = [
    { name = "kuchris", email = "kuchrisuk@gmail.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=2.0,<3",
    "torch==2.10.0",
]

[project.scripts]
capture-studio = "capture_studio:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
